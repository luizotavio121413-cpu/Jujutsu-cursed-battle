<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090b13"><title>Jujutsu Cursed Battles</title>
<style>
:root{--bg:#090b13;--panel:#151a29;--panel2:#20283b;--red:#e34855;--blue:#55b8e8;--gold:#e9c46a;--text:#f3f4f8;--muted:#aab2c5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#222d49 0,#090b13 55%);color:var(--text);font-family:system-ui,Arial,sans-serif;min-height:100vh}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}.app{max-width:560px;min-height:100vh;margin:auto;padding:16px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:2px}.logo{text-align:center;margin:24px 0 20px}.logo small{color:var(--red);letter-spacing:5px;font-weight:800}.logo h1{font-size:clamp(29px,8vw,44px);line-height:1;margin:8px 0;text-shadow:0 0 24px #e3485566}.logo p{color:var(--muted);font-size:13px}.panel{background:linear-gradient(145deg,#1b2234ed,#111624f2);border:1px solid #ffffff18;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0005}.hero{min-height:190px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(0deg,#080b14 5%,#10182b99 60%,#28375355),radial-gradient(circle at 70% 25%,#8e324a,#202c47 45%,#0b101b);overflow:hidden;position:relative}.hero:before{content:"呪";position:absolute;right:18px;top:-35px;font-size:180px;color:#ffffff0b;font-weight:900}.hero h2{font-size:25px;margin:0 0 6px}.hero p{color:#c2c9d8;font-size:13px;margin:0}.btn{background:linear-gradient(110deg,#d63e51,#9f2945);padding:14px 18px;border-radius:12px;font-weight:800;width:100%;margin-top:10px;box-shadow:0 5px 18px #d63e5133}.btn.secondary{background:#29344b;border:1px solid #ffffff1c;box-shadow:none}.btn.blue{background:linear-gradient(110deg,#247fae,#3454a0)}.btn.gold{background:linear-gradient(110deg,#98712c,#d5a64b);color:#17120a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#222b40;border:1px solid #ffffff17;border-radius:13px;padding:14px;text-align:left;min-height:80px}.tile b{display:block;font-size:15px}.tile small{color:var(--muted)}h2,h3{margin:5px 0 10px}.muted{color:var(--muted);font-size:13px}.tag{display:inline-block;background:#ffffff12;border:1px solid #ffffff19;border-radius:99px;padding:4px 9px;font-size:11px;color:#d7deed;margin:3px}.bar{height:10px;background:#080c15;border-radius:20px;overflow:hidden;margin:6px 0 10px}.fill{height:100%;background:linear-gradient(90deg,#e34855,#ff9a6b);border-radius:20px}.fill.blue{background:linear-gradient(90deg,#2579b4,#65d5ef)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.character{display:flex;gap:12px;align-items:center}.portrait{width:76px;height:92px;border-radius:12px;display:grid;place-items:center;font-size:40px;font-weight:900;background:linear-gradient(145deg,#57344b,#202f51);border:1px solid #ffffff24}.portrait.meg{background:linear-gradient(145deg,#283f54,#111827)}.hidden{display:none!important}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;bottom:8px;background:#0b101deF;padding:8px;border:1px solid #ffffff20;border-radius:15px;backdrop-filter:blur(10px);z-index:5}.nav button{background:transparent;color:#aeb8cc;padding:8px 2px;font-size:11px;border-radius:9px}.nav button.active{background:#29334b;color:white}.log{height:110px;overflow:auto;background:#090e18;border-radius:10px;padding:10px;font-size:12px;color:#c5ccda;line-height:1.5}.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actiongrid button{background:#28334b;border:1px solid #ffffff17;padding:13px 8px;border-radius:11px;font-weight:700;font-size:13px}.actiongrid button:disabled{opacity:.35}.enemy{background:linear-gradient(135deg,#482335,#1b1727);text-align:center;padding:15px;border-radius:14px}.enemy .monster{font-size:56px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#0d1320;padding:9px;border-radius:10px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted)}.sectiontitle{font-size:12px;color:var(--gold);letter-spacing:2px;margin:18px 0 8px}.notice{border-left:3px solid var(--gold);padding:8px 10px;background:#ffffff08;color:#cbd2df;font-size:12px;margin:8px 0}.choice{display:flex;gap:8px}.choice button{flex:1}.footer{text-align:center;color:#69748b;font-size:10px;padding:14px}
</style>
</head>
<body><div class="app">
<div class="top"><span>JUJUTSU HIGH</span><span id="wallet">✦ 0</span></div>
<div id="screen"></div>
<div class="nav hidden" id="nav">
<button data-tab="home" class="active">⌂<br>Início</button><button data-tab="team">♟<br>Equipe</button><button data-tab="gacha">✦<br>Gacha</button><button data-tab="forge">⚒<br>Armas</button>
</div><div class="footer">PROTÓTIPO JOGÁVEL • CONTEÚDO EM DESENVOLVIMENTO</div>
</div>
<script>
const $=s=>document.querySelector(s);
let save=JSON.parse(localStorage.getItem('jcb-save')||'null')||{started:false,hero:'yuji',coins:1200,shards:8,materials:6,owned:['yuji'],level:1,story:0,weapon:null,zone:false,turn:1};
const units={
yuji:{name:'Yuji Itadori',version:'Inicial',rarity:'Comum',hp:120,atk:22,def:13,agi:16,resource:70,type:'CE',moves:['Soco Divergente','Punho Amaldiçoado','Black Flash']},
megumi:{name:'Megumi Fushiguro',version:'Inicial',rarity:'Comum',hp:100,atk:18,def:12,agi:19,resource:90,type:'CE',moves:['Cães Divinos','Nue','Sombra Imóvel']},
gojo:{name:'Satoru Gojo',version:'Adulto',rarity:'Lendário',hp:145,atk:34,def:25,agi:28,resource:120,type:'CE',moves:['Azul','Vermelho','Vazio Roxo']},
toji:{name:'Toji Fushiguro',version:'Restrição Celestial',rarity:'Épico',hp:155,atk:32,def:24,agi:30,resource:100,type:'Estamina',moves:['Investida','Arsenal Amaldiçoado','Corte Preciso']},
nobara:{name:'Nobara Kugisaki',version:'Inicial',rarity:'Raro',hp:95,atk:24,def:11,agi:17,resource:85,type:'CE',moves:['Ressonância','Grampo','Boneca de Palha']}
};
const saveNow=()=>{localStorage.setItem('jcb-save',JSON.stringify(save));$('#wallet').textContent='✦ '+save.coins};
function shell(content){$('#screen').innerHTML=content;saveNow()}
function title(sub){return `<div class="logo"><small>呪術廻戦 • RPG DE TURNOS</small><h1>CURSED BATTLES</h1><p>${sub}</p></div>`}
function start(){shell(`${title('Ecos de uma maldição')}<div class="panel hero"><span class="tag">HISTÓRIA ORIGINAL</span><h2>Uma presença além do véu.</h2><p>Desaparecimentos misteriosos cercam uma escola abandonada. Uma energia amaldiçoada desconhecida começa a se espalhar.</p><button class="btn" onclick="choose()">START</button></div><div class="notice">Escolha seu primeiro feiticeiro. Você poderá obter outros personagens no gacha único.</div>`)}
function choose(){shell(`${title('Escolha seu primeiro personagem')}<div class="panel"><div class="character"><div class="portrait">虎</div><div><h2>Yuji Itadori</h2><span class="tag">Inicial • Corpo a corpo</span><p class="muted">Um lutador equilibrado, capaz de ativar o Punho Divergente e alcançar Black Flash.</p></div></div><button class="btn" onclick="begin('yuji')">Escolher Yuji</button></div><div class="panel"><div class="character"><div class="portrait meg">伏</div><div><h2>Megumi Fushiguro</h2><span class="tag">Inicial • Invocações</span><p class="muted">Usa as Dez Sombras para controlar o ritmo da batalha e atacar à distância.</p></div></div><button class="btn blue" onclick="begin('megumi')">Escolher Megumi</button></div>`)}
function begin(id){save.hero=id;save.owned=[id];save.started=true;save.story=0;home()}
function home(){ $('#nav').classList.remove('hidden');$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='home'));shell(`${title('Bem-vindo à Escola Técnica de Jujutsu')}<div class="panel hero"><span class="tag">CAPÍTULO ${save.story+1}</span><h2>${save.story===0?'Ecos de uma maldição':'A escola abandonada'}</h2><p>${save.story===0?'Gojo envia você para investigar relatos de desaparecimentos.':'A energia no prédio está ficando cada vez mais intensa.'}</p><button class="btn" onclick="story()">Continuar história</button></div><div class="grid"><button class="tile" onclick="battle()">⚔️ <b>Batalha</b><small>Combate por turnos</small></button><button class="tile" onclick="survival()">♾️ <b>Survival</b><small>Resista às ondas</small></button><button class="tile" onclick="duel()">🥋 <b>1 contra 1</b><small>Duelo de treino</small></button><button class="tile" onclick="team()">♟ <b>Personagens</b><small>Equipe e evolução</small></button></div><div class="panel"><div class="row"><b>Recursos</b><span>✦ ${save.coins} • Fragmentos ${save.shards} • Materiais ${save.materials}</span></div></div>`)}
function story(){shell(`${title('Capítulo '+(save.story+1))}<div class="panel"><span class="tag">CENA 01 • MISSÃO</span><h2>O chamado de Gojo</h2><p class="muted">“Há algo estranho naquela escola. A energia amaldiçoada aparece e desaparece como se estivesse respirando. Investiguem, mas não baixem a guarda.”</p><div class="hero panel"><h2>Escola Municipal Kurotsuki</h2><p>O portão range. No corredor, uma maldição toma forma diante de você.</p></div><button class="btn" onclick="battle()">Enfrentar a maldição</button></div>`)}
let fight=null;
function battle(){let u=units[save.hero];fight={hp:u.hp,ce:u.resource,enemy:95,enemyMax:95,ehp:95,turn:1,domain:0,brain:0,limb:false,zone:false,log:['Uma maldição de grau 2 apareceu!'],won:false};renderBattle()}
function renderBattle(){let u=units[save.hero];let f=fight; shell(`${title('Combate • Turno '+f.turn)}<div class="panel"><div class="row"><b>${u.name}</b><span class="tag">${u.type==='CE'?'Energia amaldiçoada':'Restrição Celestial / Estamina'}</span></div><div class="row muted"><span>HP ${Math.max(0,f.hp)}/${u.hp}</span><span>${u.type} ${f.ce}/${u.resource}</span></div><div class="bar"><div class="fill" style="width:${Math.max(0,f.hp/u.hp*100)}%"></div></div><div class="bar"><div class="fill blue" style="width:${Math.max(0,f.ce/u.resource*100)}%"></div></div><div class="enemy"><div class="monster">👹</div><b>Maldição do corredor</b><div class="muted">HP ${Math.max(0,f.enemy)}/${f.enemyMax}</div><div class="bar"><div class="fill" style="width:${Math.max(0,f.enemy/f.enemyMax*100)}%"></div></div></div><div class="sectiontitle">AÇÕES</div><div class="actiongrid"><button onclick="act('melee')">👊 Corpo a corpo</button><button onclick="act('tech')">🌀 Técnica</button><button onclick="act('energy')">⚡ Golpe de energia</button><button onclick="act('weapon')">⚔️ Arma</button><button onclick="act('black')">💥 Black Flash</button><button onclick="act('reverse')">✚ Técnica Reversa</button><button onclick="act('domain')">領 Expansão de Domínio</button><button onclick="act('chant')">📜 Encantamento</button></div><div class="sectiontitle">REGISTRO DA BATALHA</div><div class="log" id="log">${f.log.slice(-5).map(x=>'• '+x).join('<br>')}</div>${f.won?'<button class="btn gold" onclick="win()">Recompensas</button>':''}${f.hp<=0?'<button class="btn" onclick="home()">Voltar</button>':''}</div>`)}
function note(t){fight.log.push(t)}
function act(kind){let f=fight,u=units[save.hero];if(f.won||f.hp<=0)return;let dmg=0,cost=0;
if(kind==='melee'){dmg=u.atk;note('Você avançou com um golpe corpo a corpo.')}
if(kind==='tech'){cost=18;dmg=u.atk*1.65;note('Você usou '+u.moves[0]+'.')}
if(kind==='energy'){cost=25;dmg=u.atk*2.0;note('Um golpe de energia atingiu a maldição.')}
if(kind==='weapon'){dmg=u.atk*1.3+(save.weapon?12:0);note(save.weapon?'Sua arma acertou em cheio.':'Ataque físico reforçado.')}
if(kind==='black'){cost=25;dmg=u.atk*2.8;note(Math.random()<.65?'BLACK FLASH! A energia distorceu o impacto.':'O timing falhou; foi um golpe reforçado.');if(f.log[f.log.length-1].includes('BLACK')){f.zone=true;save.zone=true;note('ZONA ATIVADA: chance maior de Black Flash por 2 turnos.')} }
if(kind==='reverse'){cost=35;f.hp=Math.min(u.hp,f.hp+35);note('Técnica Reversa: energia convertida para recuperar o corpo.')}
if(kind==='domain'){if(u.type!=='CE'){note('Restrição Celestial: este personagem não possui energia para expandir domínio.');renderBattle();return}if(f.domain>0){note('O domínio já está ativo.');renderBattle();return}cost=55;f.domain=2;dmg=u.atk*2.2;note('EXPANSÃO DE DOMÍNIO! Efeito garantido por 2 turnos.')}
if(kind==='chant'){cost=12;dmg=u.atk*1.4;note('Você preparou um encantamento e liberou uma técnica amplificada.')}
if(f.ce<cost){note('Energia insuficiente!');renderBattle();return}
f.ce-=cost;f.enemy-=dmg;if(f.domain>0){f.domain--;note('O domínio continua ativo por '+f.domain+' turno(s).')}
if(f.enemy<=0){f.enemy=0;f.won=true;note('A maldição foi exorcizada!');renderBattle();return}
let edmg=Math.max(5,16-u.def*.35);if(u.type==='Estamina')edmg*=.65;f.hp-=edmg;note('A maldição contra-atacou e causou '+Math.round(edmg)+' de dano.');if(f.zone){f.zone=false;save.zone=false;note('O estado de Zona terminou.')}f.turn++;renderBattle()}
function win(){save.coins+=180;save.shards+=2;save.materials+=2;save.story++;home()}
function survival(){battle();fight.enemyMax=75;fight.enemy=75;note('Modo Survival: sobreviva a esta onda!');renderBattle()}
function duel(){battle();fight.enemyMax=125;fight.enemy=125;note('Duelo 1v1 iniciado!');renderBattle()}
function team(){ $('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='team'));let u=units[save.hero];shell(`${title('Equipe e evolução')}<div class="panel"><div class="character"><div class="portrait">${save.hero==='yuji'?'虎':'伏'}</div><div><h2>${u.name}</h2><span class="tag">${u.version}</span><span class="tag">${u.rarity}</span></div></div><div class="statgrid">${[['HP',u.hp],['ATK',u.atk],['DEF',u.def],['AGI',u.agi],['CE / Estamina',u.resource],['Nível',save.level]].map(s=>`<div class="stat"><b>${s[1]}</b><small>${s[0]}</small></div>`).join('')}</div><div class="notice">Atributos são próprios de cada versão e só mudam ao conquistar uma evolução. Não há distribuição de pontos.</div><h3>Linha de evolução</h3><p class="muted">Inicial → Shibuya → Despertar → Shinjuku</p><button class="btn" onclick="evolve()">Desafio de evolução (100 fragmentos)</button></div><div class="panel"><h3>Personagens obtidos</h3>${save.owned.map(id=>`<span class="tag">${units[id].name}</span>`).join(' ')}</div>`)}
function evolve(){if(save.shards<100){alert('Você precisa de 100 fragmentos. Consiga mais no gacha e nas missões.');return}save.shards-=100;save.level++;save.coins+=100;alert('Desafio concluído! Sua versão evoluiu. Esta é uma evolução demonstrativa do protótipo.');team()}
function gacha(){ $('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='gacha'));shell(`${title('Recrutamento único')}<div class="panel hero"><span class="tag">RECRUTAMENTO</span><h2>Chamado dos feiticeiros</h2><p>Um único gacha reúne personagens e versões de diferentes níveis de poder. A raridade acompanha a força da versão na obra.</p></div><div class="panel"><div class="row"><b>Recrutamento x1</b><span>✦ 300</span></div><button class="btn gold" onclick="pull(1)">Invocar personagem</button><div class="row"><b>Recrutamento x5</b><span>✦ 1.200</span></div><button class="btn" onclick="pull(5)">Invocar 5 personagens</button><p class="muted">O protótipo usa probabilidades demonstrativas, ainda não calibradas.</p></div>`)}
function pull(n){let cost=n===1?300:1200;if(save.coins<cost){alert('Moedas insuficientes!');return}save.coins-=cost;let pool=['nobara','toji','gojo','yuji','megumi'];let got=[];for(let i=0;i<n;i++){let r=Math.random();let id=r<.08?'gojo':r<.28?'toji':r<.52?'nobara':pool[Math.floor(Math.random()*2)];got.push(id);if(!save.owned.includes(id))save.owned.push(id);else save.shards+=5}alert('Resultado:\\n'+got.map(x=>units[x].name+' — '+units[x].rarity).join('\\n')+'\\nDuplicatas viram fragmentos!');gacha()}
function forge(){ $('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='forge'));shell(`${title('Oficina de ferramentas')}<div class="panel"><h2>Armas amaldiçoadas</h2><p class="muted">Armas são fabricadas com materiais de missões e possuem afinidades de personagem.</p><div class="row"><b>Lança Invertida do Céu</b><span class="tag">Afinidade: Toji</span></div><p class="muted">Custo: 8 materiais • bônus de dano para Toji.</p><button class="btn" onclick="craft('Lança Invertida do Céu',8)">Fabricar</button><div class="row"><b>Lâmina Negra</b><span class="tag">Afinidade: Megumi</span></div><p class="muted">Custo: 5 materiais • arma de afinidade proposta para Megumi.</p><button class="btn secondary" onclick="craft('Lâmina Negra',5)">Fabricar</button><p class="muted">Materiais disponíveis: ${save.materials}</p></div>`)}
function craft(name,cost){if(save.materials<cost){alert('Materiais insuficientes. Vença missões para conseguir mais.');return}save.materials-=cost;save.weapon=name;alert(name+' fabricada!');forge()}
function tab(t){if(t==='home')home();if(t==='team')team();if(t==='gacha')gacha();if(t==='forge')forge()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b)tab(b.dataset.tab)});
saveNow();if(save.started)home();else start();
</script></body></html>
